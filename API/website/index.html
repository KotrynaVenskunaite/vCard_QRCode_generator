<!DOCTYPE html>
<html lang="en">
    <head>
        <title>vCard QR Code</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="/styles/qrcode.css" rel="stylesheet" type="text/css">
        <!-- JQUERY -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script> 
        <script src="https://unpkg.com/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
        <script src="javascript/qrcode.js" defer></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.4.4/qrcode.js" integrity="sha512-oxrVyBhqnzQ0BzuM0A/6dEIk0alz0p4SpDRaWvtuUoarIc8rnL5lVniHG5Dp21MRFojcQcmKHjaskNXhSaUPPw==" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
    </head>

    <header>
        <div class="image_container">
            <div class="banner_cont">
                <img src="img/QR title_2.png" alt="Banner" class="banner">
            </div>
            <div class="banner_chara_cont">
                <img src="img/Oscar.png" alt="Banner_character" , class="Oscar">
            </div>
        </div>
    </header>

    <body>
        <div class="page_container">
            <div id="qrcode-container">
                <!-- <h1>QR CODE GENERATOR</h1> -->

                <form id="field_form">
                    <div class="field_container">
                        
                        <div class="info_field">
                            <label for="first_name">First name:</label>
                            <input type="text" maxlength="16" id="first_name" name="fname"/>
                            <a id="name_alert" class="alert"></a>
                        </div>

                        <div class="info_field">
                            <label for="lname">Last name:</label>
                            <input type="text" maxlength="16" id="last_name" name="lname"/>
                        </div>

                        <div class="info_field">
                            <label for="tel">Tel:</label>
                            <input type="tel" maxlength="15" minLength="2" id="phone_number" name="tel"/>
                            <a id="tel_alert" class="alert"></a>
                        </div>

                        <div class="info_field">
                            <label for="email" maxlength="100">Email:</label>
                            <input type="email" id="email" name="email"/>
                        </div>

                        <div class="info_field">
                            <label for="street" maxlength="100">Street:</label>
                            <input type="text" id="adress_street" name="street"/>
                        </div>

                        <div class="info_field">
                            <label for="city" maxlength="100">City:</label>
                            <input type="text" id="adress_city" name="city"/>
                        </div>

                        <div class="info_field">
                            <label for="country" maxlength="100">Country:</label>
                            <input type="text" id="adress_country" name="country"/>
                        </div>

                        <div class="info_field">
                            <label for="birthday">Birthday:</label>
                            <input type="date" id="birthday" name="birthday" min="1926-01-01"  max="2020-01-01"/>
                        </div>
                    
                        
                    </div>
                    <input type="submit" id="qrcode_button" value="Generate">
                </form>
            </div>

            <div class="qr_box_field">
                <div id="qr_box"><img id="qrcode_image"/></div>
                <button id="download_button" type="button" disabled>Download</button>
            </div>

            <div class="scroll_container">
                <div id="top_names">NAME    | TEL</div>
                <div id="entry_container">
                    <div id="entries">
                        <div class="retrieve_button" id = 0></div>
                        <div id="entry_name"></div>
                        <div id="entry_tel"></div>
                    </div>
                </div>
            </div>

            <div class="scroll_container">
                <div id="top_names">LOGS</div>
                <div id="log_container">
                    <div id="log_entries">
                        <!-- <div id="time"></div>
                        <div id="ip"></div>
                        <div id="method"></div>
                        <div id="path"></div>
                        <div id="status"></div>
                        <div id="user"></div>
                        <div id="duration"></div> -->
                    </div>
                </div>
            </div>
        </div>

       
        <br>
        <div id="qr-container"></div>
