name: CI

on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:20
    defaults:
      run:
        working-directory: API

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: API/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
  promote:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Push master to main
        run: git push origin master:main
